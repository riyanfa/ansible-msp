# Copy to onboarding.ini (gitignored) and add hosts with the creds the
# customer gave you. chmod 600 any key first.
#
#   ansible-playbook -i customers/<name>/onboarding.ini playbooks/onboard.yml
#
# On success hosts are appended to managed.ini — commit that, then delete
# them from onboarding.ini and shred the bootstrap keys.
[new_hosts]
# 10.0.0.5 ansible_user=root   ansible_ssh_private_key_file=~/.ssh/bootstrap/vm1.pem
# 10.0.0.6 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/bootstrap/vm2.pem
