[defaults]
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
# NOT `stdout_callback = yaml` — that plugin was removed in community.general 12.
callback_result_format = yaml

[ssh_connection]
# accept-new: accepts unknown hosts, still refuses CHANGED host keys (unlike `no`).
# IdentitiesOnly: stops ssh-agent offering every other key and tripping MaxAuthTries.
ssh_args = -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
